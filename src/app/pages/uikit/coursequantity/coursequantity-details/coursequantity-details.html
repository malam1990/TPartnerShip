<div class="card flex flex-col flex flex-col gap-1 w-full ">
    <div class="custom-theme-btn p-ripple font-semibold text-xl  ">
        TOTAL COURSE COMPANY
    </div>
    <div class="card">


        <p-table #dt1 [value]="CompanyTotalCourseQuantityList" dataKey="id" [rows]="10" [loading]="loading"
            [rowHover]="true" [showGridlines]="true" [paginator]="true"
            [globalFilterFields]="['id', 'company_name', 'course_Name', 'masterPartnerName', 'quantity', 'soldAt']"
            responsiveLayout="scroll">
            <ng-template #caption>
                <div class="flex justify-between items-center flex-column sm:flex-row">
                    <button pButton label="Clear" class="p-button-outlined mb-2" icon="pi pi-filter-slash"
                        (click)="clear(dt1)"></button>
                    <p-iconfield iconPosition="left" class="ml-auto">
                        <p-inputicon>
                            <i class="pi pi-search"></i>
                        </p-inputicon>
                        <input pInputText type="text" (input)="onGlobalFilter(dt1, $event)"
                            placeholder="Search keyword" />
                    </p-iconfield>
                </div>
            </ng-template>
            <ng-template #header>
                <tr>

                    <th style="min-width: 12rem">
                        <div class="flex justify-between items-center">
                            ID
                            <p-columnFilter type="text" field="partnerName" display="menu"
                                placeholder="Search by name"></p-columnFilter>
                        </div>
                    </th>
                    <th style="min-width: 12rem">
                        <div class="flex justify-between items-center">
                            CourseName
                            <p-columnFilter type="text" field="masterPartnerName" display="menu"
                                placeholder="Search..." />
                        </div>
                    </th>
                    <th style="min-width: 12rem">
                        <div class="flex justify-between items-center">
                            Total Quantity
                            <p-columnFilter type="text" field="course_Name" display="menu" placeholder="Search..." />
                        </div>
                    </th>


                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-CompanyTotalCourseQuantity>
                <tr>

                    <td>
                        <div class="flex items-center gap-2">
                            {{ CompanyTotalCourseQuantity.courseId }}

                        </div>
                    </td>

                    <td>

                        <span>{{ CompanyTotalCourseQuantity.courseName }}</span>

                    </td>
                    <td>

                        {{ CompanyTotalCourseQuantity.totalQuantity }}
                    </td>


                </tr>
            </ng-template>


        </p-table>
    </div>
</div>
