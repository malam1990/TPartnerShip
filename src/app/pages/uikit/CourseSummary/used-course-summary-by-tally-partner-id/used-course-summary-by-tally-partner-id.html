<p-toast></p-toast>

<p-table 
  [value]="tppartnerList" 
  dataKey="id" 
  [expandedRowKeys]="expandedRows" 
  (onRowExpand)="onRowExpand($event)" 
  (onRowCollapse)="onRowCollapse($event)"
  [tableStyle]="{ 'min-width': '60rem' }"
>
  <ng-template pTemplate="caption">
    <div class="flex flex-wrap justify-end gap-2">
      <p-button label="Expand All" icon="pi pi-plus" text (onClick)="onRowExpand($event)" />
      <p-button label="Collapse All" icon="pi pi-minus" text (onClick)="onRowCollapse($event)" />
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th style="width: 5rem"></th>
      <th>Name</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-partner let-expanded="expanded">
    <tr>
      <td>
        <p-button 
          type="button" 
          pRipple 
          [pRowToggler]="partner" 
          [text]="true" 
          severity="secondary"  
          [rounded]="true" 
          [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"
        ></p-button>
      </td>
      <td>{{ partner.name }}</td>
    </tr>
  </ng-template>

  <ng-template pTemplate="rowexpansion" let-partner>
    <tr>
      <td colspan="2">
        <div class="p-4">
          <h5>Courses for {{ partner.name }}</h5>
          <p-table [value]="partner.courseSummary" dataKey="courseId" *ngIf="partner.courseSummary?.length">
            <ng-template pTemplate="header">
              <tr>
                <th>Course Name</th>
                <th>Total Quantity</th>
                <th>Used Quantity</th>
                <th>Remaining Quantity</th>
              </tr>
            </ng-template>

            <ng-template pTemplate="body" let-course>
              <tr>
                <td>{{ course.courseName }}</td>
                <td>{{ course.totalQuantity }}</td>
                <td>{{ course.usedQuantity }}</td>
                <td>{{ course.remainingQuantity ?? 0 }}</td>
              </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
              <tr>
                <td colspan="4">No courses available.</td>
              </tr>
            </ng-template>
          </p-table>

          <div *ngIf="!partner.courseSummary || partner.courseSummary.length === 0">
            No courses available.
          </div>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
