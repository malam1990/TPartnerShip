<p-toolbar styleClass="mb-6">
    <ng-template #start>
       
        <p-button 
  label="Add Institute Details" 
  icon="pi pi-plus" 
  class="mr-2 my-custom-btn" 
  (onClick)="openNew()" />
    </ng-template>

</p-toolbar>

<p-table
   #dt
  [value]="InstituteList"
  [rows]="10"
  [paginator]="true"
  [globalFilterFields]="['instituteName','instituteId']"
  [tableStyle]="{ 'min-width': '75rem' }"
  [(selection)]="selectedCourses"
  [rowHover]="true"
  dataKey="instituteId"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} courses"
  [showCurrentPageReport]="true"
  [rowsPerPageOptions]="[10, 20, 30,40,50,60]"
        >
            <ng-template #caption>
                <div class="flex items-center justify-between">
                    <h5 class="m-0">Institute  Details</h5>
                    <p-iconfield>
                        <p-inputicon styleClass="pi pi-search" />
                        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
                    </p-iconfield>
                </div>
            </ng-template>
            <ng-template #header>
                <tr>
                    <th style="width: 3rem">
                        <p-tableHeaderCheckbox />
                    </th>
                    <th style="min-width: 16rem">Institute ID</th>
                    <th pSortableColumn="name" style="min-width:16rem">
                        Institute Name
                        <p-sortIcon field="name" />
                    </th>
                  
                    <th pSortableColumn="inventoryStatus" style="min-width: 12rem">
                        Status
                        <p-sortIcon field="inventoryStatus" />
                    </th>
                    <th style="min-width: 12rem"></th>
                </tr>
            </ng-template>
            <ng-template #body  let-Institutes let-rowIndex="rowIndex">
                <tr>
                    <td style="width: 3rem">
                        <p-tableCheckbox [value]="Institutes" />
                    </td>
                    <td style="min-width: 12rem"> {{ Institutes.instituteId }}</td>
                    <td style="min-width: 16rem">{{ Institutes.instituteName }}</td>
                    
                    <td>
                        <span [ngClass]="Institutes.isactive ? 'text-success' : 'text-danger'">

                        <p-toggleswitch [(ngModel)]="Institutes.isactive" [ngModelOptions]="{standalone: true}" />
                        {{ Institutes.isactive ? 'Active' : 'Inactive' }} </span>
                    </td>
                    <td>
                        <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"    (click)="editInstitutes(Institutes)"/>
                        <!-- <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" /> -->
                    </td>
                </tr>
            </ng-template>
        </p-table>

<p-dialog [(visible)]="CourseQtyDialog" [style]="{ width: '450px' }" header="Add Institute Details" [modal]="true">
    <ng-template #content>

        <input pInputText id="instituteId" type="hidden" [(ngModel)]="instituteFormData.instituteId" name="instituteId"
            [ngModelOptions]="{standalone: true}" />
        <div class="flex flex-col gap-6">
        
            <div>
                <label for="name" class="block font-bold mb-3">Institute Name</label>
                <input type="text" pInputText id="name" [(ngModel)]="instituteFormData.instituteName" required autofocus fluid />
                <small class="text-red-500" *ngIf="submitted && !instituteFormData.instituteName">Place Name is required.</small>
            </div>
            <div>
                <label for="description" class="block font-bold mb-3">Status</label>
                <p-toggleswitch [(ngModel)]="instituteFormData.isactive"
                    [ngModelOptions]="{standalone: true}"></p-toggleswitch>
                <span class="ml-2 text-sm">{{ instituteFormData.isactive ? 'Active' : 'Inactive' }}</span>
            </div>

        </div>
    </ng-template>

    <ng-template #footer>
        <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()" />
        <p-button label="Save" icon="pi pi-check" (click)="saveInstitutes()" />
    </ng-template>
</p-dialog>

<p-confirmdialog [style]="{ width: '450px' }" />

        <p-toast></p-toast>
