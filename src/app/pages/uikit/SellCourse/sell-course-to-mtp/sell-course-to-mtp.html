<form #partnerForm="ngForm" (ngSubmit)="submitSellCourseToMasterPartnerForm()">
    <p-fluid>

        <div class="flex mt-8">

            <div class="card flex flex-col gap-2 w-full">

                <div class="custom-theme-btn p-ripple font-semibold text-md  ">
                    COMPANY SELL COURSE TO MASTER TALLY PARTNER
                </div>
                <div class="card flex flex-col flex flex-col gap-1 w-full ">
                    <div class="flex flex-col md:flex-row gap-6">
                        <div class="flex flex-wrap gap-2 w-full">
                            <label for="state">Company Name Type</label>
                            <p-select [(ngModel)]="SellCourseToMasterPartnerForm.CompanyId" [options]="CompanyList"
                                optionValue="companyId" optionLabel="companyName" placeholder="Select Company"
                                class="w-full" [ngModelOptions]="{standalone: true}">
                            </p-select>

                        </div>
                        <div class="flex flex-wrap gap-2 w-full">
                            <label for="SerailNo">Course Name</label>
                            <p-select [(ngModel)]="SellCourseToMasterPartnerForm.CourseId" [options]="CourseList"
                                optionValue="courseId" optionLabel="courseName" placeholder="Select Course"
                                class="w-full" [ngModelOptions]="{standalone: true}">
                            </p-select>
                        </div>

                        <div class="flex flex-wrap gap-2 w-full">
                            <label for="SerailNo">Master Tally Partner Name</label>
                            <p-select [(ngModel)]="SellCourseToMasterPartnerForm.PartnerId"
                                [options]="MasterTallyPartnerList" optionValue="partnerid" optionLabel="partnerName"
                                placeholder="Select Course" class="w-full" [ngModelOptions]="{standalone: true}">
                            </p-select>
                        </div>
                    </div>



                    <div class="flex flex-col md:flex-row gap-6">
                        <div class="flex flex-wrap gap-2 w-full">
                            <label for="state">Sell Course quantity</label>
                            <input pInputText id="Quantity" type="text"
                                [(ngModel)]="SellCourseToMasterPartnerForm.Quantity" name="Quantity"
                                [ngModelOptions]="{standalone: true}" />

                        </div>
                        <div class="flex flex-wrap gap-2 w-full">

                        </div>
                        <div class="flex flex-wrap gap-2 w-full">

                        </div>
                    </div>
                    <div class="flex flex-col md:flex-row gap-12">
                   
                        <div class="flex flex-col md:flex-row gap-2">
                            <button pButton type="submit"> {{ SellCourseToMasterPartnerForm.Id ? 'Update' : 'Submit'
                                }}</button>
                        </div>

                    </div>
                </div>

            </div>
            <p-toast></p-toast>
        </div>
    </p-fluid>

</form>
